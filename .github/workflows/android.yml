name: android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi,aarch64-linux-android,i686-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" >/dev/null

      - name: Run unit tests
        run: ./gradlew :android:testDebugUnitTest --no-daemon

      - name: Build APKs (debug + release)
        run: |
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973" ./gradlew :android:assembleDebug :android:assembleRelease --no-daemon

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: demo-analysis-android-apks
          path: |
            android/build/outputs/apk/debug/demo-analysis-android-debug.apk
            android/build/outputs/apk/release/demo-analysis-android-release.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: demo-analysis-android-apks

      - name: Attach APKs to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            demo-analysis-android-debug.apk
            demo-analysis-android-release.apk
